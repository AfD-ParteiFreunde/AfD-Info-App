<script>
  var POLLS = {"Baden-Württemberg": 22.0, "Bayern": 20.0, "Berlin": 18.0, "Brandenburg": 37.0, "Bremen": 17.0, "Hamburg": 12.0, "Hessen": 22.0, "Mecklenburg-Vorpommern": 35.9, "Niedersachsen": 20.0, "Nordrhein-Westfalen": 17.0, "Rheinland-Pfalz": 24.0, "Saarland": 23.0, "Sachsen": 42.0, "Sachsen-Anhalt": 41.7, "Schleswig-Holstein": 18.0, "Thüringen": 40.0};
  var MIN = 12.0, MAX = 42.0;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c1, c2, t) {
    return [Math.round(lerp(c1[0],c2[0],t)), Math.round(lerp(c1[1],c2[1],t)), Math.round(lerp(c1[2],c2[2],t))];
  }
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  // gradient stops: low #cfe6f7 -> mid #009EE0 -> high #0A2A43
  var LOW = [207, 230, 247], MID = [0, 158, 224], HIGH = [10, 42, 67];
  function colorFor(v) {
    var t = (v - MIN) / (MAX - MIN);
    t = Math.max(0, Math.min(1, t));
    if (t < 0.5) return rgb(mix(LOW, MID, t / 0.5));
    return rgb(mix(MID, HIGH, (t - 0.5) / 0.5));
  }

  var paths = document.querySelectorAll('.st');
  paths.forEach(function (p) {
    var v = POLLS[p.getAttribute('data-name')];
    if (v != null) p.style.fill = colorFor(v);
  });

  var current = null;
  function select(p) {
    if (current) current.classList.remove('sel');
    current = p;
    p.classList.add('sel');
    var name = p.getAttribute('data-name');
    var v = POLLS[name];
    document.getElementById('name').textContent = name;
    document.getElementById('pct').textContent = v != null ? (v.toString().replace('.', ',') + ' %') : '–';
    document.getElementById('meta').textContent = 'AfD · Landtagswahl';
    if (window.StateMap && window.StateMap.onSelect) window.StateMap.onSelect(name);
  }

  paths.forEach(function (p) {
    p.addEventListener('click', function () { select(p); });
  });

  // If app calls selectState(name)
  window.selectState = function (name) {
    var found = null;
    paths.forEach(function (p) { if (p.getAttribute('data-name') === name) found = p; });
    if (found) select(found);
  };
</script>
